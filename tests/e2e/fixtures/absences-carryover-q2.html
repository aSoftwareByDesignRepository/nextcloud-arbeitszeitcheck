<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Absences carryover Q2 fixture</title>
	<style>
		body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #ececec; color: #222; }
		.wrap { max-width: 48rem; margin: 1.5rem auto; padding: 1rem; background: #fff; }
		.stats-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.75rem; }
		.stat-card { border: 1px solid #c4c4c4; border-radius: 0.5rem; padding: 1rem; min-height: 6rem; }
		.stat-value--hero { font-size: 2rem; font-weight: 700; display: block; }
		.stat-card__meta { display: block; margin-top: 0.5rem; line-height: 1.4; }
		.notice { background: #fff8e6; border: 1px solid #e6c35c; padding: 0.75rem; border-radius: 0.375rem; margin: 0.75rem 0; }
	</style>
</head>
<body>
<div class="wrap" id="absences-carryover-fixture">
	<h1 id="stats-title">Vacation balance 2025-07-01 → 2026-06-30</h1>
	<div class="notice" role="status" id="stats-carryover-deadline-notice">
		<p>Carryover deadline has passed (30.09.2025). New requests can no longer use last year’s remaining days.</p>
	</div>
	<div class="stats-grid" role="group" aria-labelledby="stats-title">
		<div class="stat-card">
			<span class="stat-label">Annual entitlement</span>
			<span class="stat-value">25</span>
		</div>
		<div class="stat-card">
			<span class="stat-label" id="stat-carryover-pool-label">Resturlaub</span>
			<span class="stat-value" aria-labelledby="stat-carryover-pool-label">0</span>
			<span class="stat-card__meta" id="stat-carryover-usable">Carryover ended 30.09.2025 — book from annual leave only</span>
		</div>
		<div class="stat-card">
			<span class="stat-label">Used this year</span>
			<span class="stat-value">7</span>
		</div>
		<div class="stat-card stat-card--remaining stat-card--hero">
			<span class="stat-label" id="stat-remaining-label">Remaining</span>
			<span class="stat-value stat-value--hero" aria-labelledby="stat-remaining-label">18</span>
			<span class="stat-sublabel">days</span>
		</div>
		<div class="stat-card">
			<span class="stat-label">Pending requests</span>
			<span class="stat-value">0</span>
		</div>
	</div>
</div>
</body>
</html>
